# OTA Update Check - 12 hour interval

substitutions:
  current_version: !env_var version "unknown"

# Ed25519 firmware signature verification (external component, see
# esphome/components/ota_signature/). The public key must match the server's
# FIRMWARE_SIGNING_PUBKEY — see DEVICE_SIGNING.md.
ota_signature:
  id: fw_sig_verifier
  http_request_id: http_request_data
  public_key: !secret firmware_signing_pubkey

# Global variables for OTA update
globals:
  - id: ota_url
    type: std::string
    initial_value: '""'
  - id: ota_md5
    type: std::string
    initial_value: '""'
  - id: ota_signature_b64
    type: std::string
    initial_value: '""'
  - id: ota_sig_alg
    type: std::string
    initial_value: '""'
  - id: ota_sig_verified
    type: bool
    initial_value: 'false'
  - id: ota_reject_reason
    type: std::string
    initial_value: '""'

# ESPHome OTA component for firmware updates
ota:
  - platform: esphome
    id: esphome_ota
    password: !secret ota_password
  - platform: http_request
    id: http_ota

# Buttons are now defined in 01_interface_order.yaml for web UI ordering

# Text sensors are now defined in 01_interface_order.yaml for web UI ordering
text_sensor:
  - platform: template
    name: "Update Status"
    id: update_status_sensor
    internal: true
    update_interval: never
    lambda: |-
      return {"Ready for update check"};

# Interval to automatically check for updates every 12 hours
interval:
  - interval: 12h
    then:
      - script.execute: check_firmware_update

# Scripts for OTA functionality
script:
  - id: check_firmware_update
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - logger.log: 
                level: INFO
                format: "=== OTA UPDATE CHECK STARTED ==="
            # Update version sensor during check
            - component.update: current_version_sensor
            - logger.log: 
                level: INFO
                format: "Current firmware version: v${current_version}"
            - http_request.get:
                id: http_request_data
                url: "https://energypebble.tdlx.nl/api/ota/check"
                request_headers:
                  Connection: "close"
                  User-Agent: "ESPHome-OTA/1.0"
                  X-Device-ID: !lambda |-
                    uint64_t mac = ESP.getEfuseMac();
                    static char mac_str[13];
                    sprintf(mac_str, "%012llx", mac);
                    return mac_str;
                  X-Current-Version: "v${current_version}"
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200) {
                          json::parse_json(body, [](JsonObject root) -> bool {
                            if (root["version"]) {
                              std::string latest_version = root["version"];
                              std::string current = "v${current_version}"; // Current firmware version
                              
                              ESP_LOGI("OTA", "Latest stable version from server: %s", latest_version.c_str());
                              ESP_LOGI("OTA", "Comparing versions - Current: %s vs Latest Stable: %s", current.c_str(), latest_version.c_str());
                              
                              // Simple version comparison - assumes format vX.Y.Z
                              auto parse_version = [](const std::string& v) {
                                std::string clean = v.substr(1); // Remove 'v' prefix
                                int major = 0, minor = 0, patch = 0;
                                sscanf(clean.c_str(), "%d.%d.%d", &major, &minor, &patch);
                                return std::make_tuple(major, minor, patch);
                              };
                              
                              auto current_ver = parse_version(current);
                              auto latest_ver = parse_version(latest_version);
                              
                              int curr_maj = std::get<0>(current_ver);
                              int curr_min = std::get<1>(current_ver);
                              int curr_pat = std::get<2>(current_ver);
                              
                              int new_maj = std::get<0>(latest_ver);
                              int new_min = std::get<1>(latest_ver);
                              int new_pat = std::get<2>(latest_ver);
                              
                              bool update_available = (new_maj > curr_maj) || 
                                                    (new_maj == curr_maj && new_min > curr_min) ||
                                                    (new_maj == curr_maj && new_min == curr_min && new_pat > curr_pat);
                              
                              if (update_available) {
                                ESP_LOGI("OTA", "🔄 UPDATE AVAILABLE!");
                                ESP_LOGI("OTA", "   Current version: %s", current.c_str());
                                ESP_LOGI("OTA", "   Latest stable version: %s", latest_version.c_str());
                                if (root["download_url"]) {
                                  std::string download_url = root["download_url"];
                                  ESP_LOGI("OTA", "   Download URL: %s", download_url.c_str());
                                }
                                
                                // Display release notes if available
                                if (root["release_notes"]) {
                                  std::string release_notes = root["release_notes"];
                                  ESP_LOGI("OTA", "   Release Notes: %s", release_notes.c_str());
                                }
                                
                                // Update status sensor and trigger automatic installation
                                id(update_status_sensor).publish_state("Update available: " + latest_version);
                                ESP_LOGI("OTA", "🔄 Starting automatic installation...");
                                ESP_LOGI("OTA", "=== UPDATE CHECK COMPLETE - UPDATE AVAILABLE ===");
                              } else {
                                ESP_LOGI("OTA", "✅ Firmware is up to date - no action needed");
                                ESP_LOGI("OTA", "   Current: %s = Latest: %s", current.c_str(), latest_version.c_str());
                                id(update_status_sensor).publish_state("Up to date");
                                ESP_LOGI("OTA", "=== UPDATE CHECK COMPLETE - NO UPDATES ===");
                              }
                              return true;
                            }
                            return false;
                          });
                        } else {
                          ESP_LOGW("OTA", "❌ UPDATE CHECK FAILED!");
                          ESP_LOGW("OTA", "   HTTP Status: %d", response->status_code);
                          ESP_LOGW("OTA", "   Server response: %s", body.c_str());
                          ESP_LOGW("OTA", "=== UPDATE CHECK COMPLETE - ERROR ===");
                          id(update_status_sensor).publish_state("Check failed - HTTP " + std::to_string(response->status_code));
                        }
                    - lambda: |-
                        // Check if update was found and trigger automatic installation
                        std::string status = id(update_status_sensor).state;
                        if (status.find("Update available:") != std::string::npos) {
                          ESP_LOGI("OTA", "🚀 Triggering automatic OTA installation...");
                        }
                    - if:
                        condition:
                          lambda: |-
                            std::string status = id(update_status_sensor).state;
                            return status.find("Update available:") != std::string::npos;
                        then:
                          - script.execute: perform_ota_update
                    - script.execute: notify_version
          else:
            - logger.log:
                level: WARN
                format: "⚠️  WiFi not connected - cannot check for updates"
            - logger.log:
                level: INFO  
                format: "=== UPDATE CHECK SKIPPED - NO WIFI ==="
            - text_sensor.template.publish:
                id: update_status_sensor
                state: "No WiFi - check skipped"

  - id: perform_ota_update
    then:
      - logger.log:
          level: INFO
          format: "Getting latest firmware info for OTA update..."
      - http_request.get:
          id: http_request_data
          url: "https://energypebble.tdlx.nl/api/ota/check"
          request_headers:
            Connection: "close"
            User-Agent: "ESPHome-OTA/1.0"
            X-Device-ID: !lambda |-
              uint64_t mac = ESP.getEfuseMac();
              static char mac_str[13];
              sprintf(mac_str, "%012llx", mac);
              return mac_str;
            X-Current-Version: "v${current_version}"
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  id(ota_url) = "";
                  id(ota_md5) = "";
                  id(ota_signature_b64) = "";
                  id(ota_sig_alg) = "";
                  id(ota_sig_verified) = false;
                  if (response->status_code == 200) {
                    json::parse_json(body, [](JsonObject root) -> bool {
                      if (root["download_url"] && root["md5_checksum"]) {
                        std::string download_url = root["download_url"];
                        std::string md5_hash = root["md5_checksum"];
                        std::string sha256_hash = "";

                        // Get SHA-256 hash if available for additional security logging
                        if (root["checksum"]) {
                          sha256_hash = root["checksum"].as<const char*>();
                          ESP_LOGI("OTA", "SHA-256 hash for verification: %s", sha256_hash.c_str());
                        }

                        // Detached Ed25519 signature over the raw firmware bytes
                        // (may be JSON null for legacy unsigned releases -> empty string)
                        std::string signature = root["signature"] | "";
                        std::string signature_alg = root["signature_alg"] | "";

                        ESP_LOGI("OTA", "Starting HTTP OTA update from: %s", download_url.c_str());
                        ESP_LOGI("OTA", "Expected MD5: %s", md5_hash.c_str());
                        ESP_LOGI("OTA", "Signature: %s (alg: %s)",
                                 signature.empty() ? "<MISSING>" : "present",
                                 signature_alg.empty() ? "<none>" : signature_alg.c_str());

                        // Set global variables for OTA action
                        id(ota_url) = download_url;
                        id(ota_md5) = md5_hash;
                        id(ota_signature_b64) = signature;
                        id(ota_sig_alg) = signature_alg;
                        return true;
                      }
                      return false;
                    });
                  } else {
                    ESP_LOGW("OTA", "Failed to get update info - HTTP %d", response->status_code);
                    id(update_status_sensor).publish_state("Update failed - check logs");
                  }
              - if:
                  condition:
                    lambda: 'return !id(ota_url).empty() && !id(ota_md5).empty();'
                  then:
                    # FAIL CLOSED: refuse anything that is not a well-formed
                    # Ed25519-signed release. The device keeps running its
                    # current firmware; it never flashes unverified bytes.
                    - if:
                        condition:
                          lambda: 'return !id(ota_signature_b64).empty() && id(ota_sig_alg) == "ed25519";'
                        then:
                          - logger.log:
                              level: INFO
                              format: "Verifying Ed25519 firmware signature before flashing..."
                          - text_sensor.template.publish:
                              id: update_status_sensor
                              state: "Verifying signature..."
                          - lambda: |-
                              id(ota_sig_verified) = id(fw_sig_verifier).verify_url(id(ota_url), id(ota_signature_b64));
                          - if:
                              condition:
                                lambda: 'return id(ota_sig_verified);'
                              then:
                                - lambda: |-
                                    // The flash step below is pinned to the MD5 of the
                                    // bytes that passed signature verification, not the
                                    // server-asserted MD5 (defends the re-download).
                                    if (id(fw_sig_verifier).verified_md5() != id(ota_md5)) {
                                      ESP_LOGW("OTA", "Server MD5 (%s) differs from verified MD5 (%s) - using verified",
                                               id(ota_md5).c_str(), id(fw_sig_verifier).verified_md5().c_str());
                                    }
                                - logger.log:
                                    level: INFO
                                    format: "Signature valid - performing HTTP OTA update with NVS preservation..."
                                - text_sensor.template.publish:
                                    id: update_status_sensor
                                    state: "Installing update..."
                                - ota.http_request.flash:
                                    url: !lambda 'return id(ota_url);'
                                    md5: !lambda 'return id(fw_sig_verifier).verified_md5();'
                              else:
                                - lambda: |-
                                    id(ota_reject_reason) = "invalid_signature";
                                    ESP_LOGE("OTA", "Signature verification failed: %s", id(fw_sig_verifier).last_error().c_str());
                                - script.execute: ota_update_rejected
                        else:
                          - lambda: |-
                              id(ota_reject_reason) = id(ota_signature_b64).empty() ? "unsigned_firmware" : "unsupported_signature_alg";
                          - script.execute: ota_update_rejected
                  else:
                    - logger.log:
                        level: ERROR
                        format: "❌ Failed to get OTA URL or MD5 hash"
                    - text_sensor.template.publish:
                        id: update_status_sensor
                        state: "Update failed - missing data"

  # An offered update was refused (missing/invalid signature). Keep running the
  # current firmware, show a distinct LED error state, and tell the server.
  - id: ota_update_rejected
    then:
      - lambda: |-
          ESP_LOGE("OTA", "⛔ OTA UPDATE REFUSED (%s) - keeping current firmware v${current_version}", id(ota_reject_reason).c_str());
          id(update_status_sensor).publish_state("Update REFUSED: " + id(ota_reject_reason));
      - script.execute: ota_signature_alert
      - http_request.post:
          id: http_request_data
          url: !lambda |-
            uint64_t mac = ESP.getEfuseMac();
            char mac_str[13];
            sprintf(mac_str, "%012llx", mac);
            return "https://energypebble.tdlx.nl/api/ota/status/" + std::string(mac_str);
          request_headers:
            Content-Type: "application/json"
            User-Agent: "ESPHome-OTA/1.0"
          json:
            version: "${current_version}"
            status: !lambda 'return "rejected_" + id(ota_reject_reason);'
            timestamp: !lambda |-
              auto time = id(api_time).now();
              char timestamp[32];
              sprintf(timestamp, "%04d-%02d-%02dT%02d:%02d:%02dZ",
                     time.year, time.month, time.day_of_month,
                     time.hour, time.minute, time.second);
              return std::string(timestamp);
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    ESP_LOGI("OTA", "Reported rejected update to server");
                  } else {
                    ESP_LOGW("OTA", "Failed to report rejected update - HTTP %d", response->status_code);
                  }

  # Distinct LED error state for signature failure: the whole ring plus the
  # center LED blink magenta (a color never used by the normal G/Y/R price
  # display), then the regular API refresh restores the price colors.
  - id: ota_signature_alert
    mode: single
    then:
      - repeat:
          count: 6
          then:
            - lambda: |-
                esphome::light::LightState* leds[] = {
                  id(center_led),
                  id(ring_segment_1), id(ring_segment_2), id(ring_segment_3), id(ring_segment_4),
                  id(ring_segment_5), id(ring_segment_6), id(ring_segment_7), id(ring_segment_8)
                };
                for (auto *led : leds) {
                  auto call = led->turn_on();
                  call.set_brightness(0.5f);
                  call.set_rgb(1.0f, 0.0f, 1.0f);  // magenta
                  call.set_transition_length(0);
                  call.perform();
                }
            - delay: 400ms
            - lambda: |-
                esphome::light::LightState* leds[] = {
                  id(center_led),
                  id(ring_segment_1), id(ring_segment_2), id(ring_segment_3), id(ring_segment_4),
                  id(ring_segment_5), id(ring_segment_6), id(ring_segment_7), id(ring_segment_8)
                };
                for (auto *led : leds) {
                  auto call = led->turn_off();
                  call.set_transition_length(0);
                  call.perform();
                }
            - delay: 400ms
      # Restore the normal price display
      - script.execute: simple_api_call

  - id: notify_version
    then:
      - logger.log:
          level: INFO
          format: "Notifying server of current version status"
      - http_request.post:
          id: http_request_data
          url: !lambda |-
            uint64_t mac = ESP.getEfuseMac();
            char mac_str[13];
            sprintf(mac_str, "%012llx", mac);
            return "https://energypebble.tdlx.nl/api/ota/status/" + std::string(mac_str);
          request_headers:
            Content-Type: "application/json"
            User-Agent: "ESPHome-OTA/1.0"
          json:
            version: "${current_version}"
            status: "updated"
            timestamp: !lambda |-
              auto time = id(api_time).now();
              char timestamp[32];
              sprintf(timestamp, "%04d-%02d-%02dT%02d:%02d:%02dZ", 
                     time.year, time.month, time.day_of_month,
                     time.hour, time.minute, time.second);
              return std::string(timestamp);
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    ESP_LOGI("OTA", "✅ Successfully notified server of OTA update");
                  } else {
                    ESP_LOGW("OTA", "⚠️  Failed to notify server - HTTP %d", response->status_code);
                  }
