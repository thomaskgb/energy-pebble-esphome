# Energy Pebble - Main Configuration
esphome:
  name: energy-pebble
  friendly_name: Energy Pebble
  # Appends the last 3 MAC bytes to the device name: "energy-pebble-a1b2c3".
  # Makes the BLE picker distinguish neighboring Pebbles (and other ESPHome
  # devices), and lets the setup page verify the picked device against the
  # QR-sticker device ID. NOTE: this renames the hostname/mDNS of fielded
  # devices after OTA (energy-pebble.local -> energy-pebble-xxxxxx.local).
  name_add_mac_suffix: true
  project:
    name: "thomaskgb.energy-pebble"
    version: !env_var version
  # Disable safe mode to prevent unexpected behavior
  on_boot:
    priority: 600
    then:
      - logger.log: 
          level: INFO
          format: "Energy Pebble booted successfully"
      - script.execute: boot_led_sequence
      - delay: 5s
      - logger.log: 
          level: INFO
          format: "Boot delay completed - system stable"
      - script.execute: simple_api_call

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# Explicitly configure preferences to ensure WiFi credentials persist
preferences:
  flash_write_interval: 5min

# Enable logging with reduced verbosity to prevent log spam
logger:
  level: INFO
  logs:
    component: ERROR
    web_server: ERROR
    light: ERROR  # Silence verbose LED logging
    esp32_rmt_led_strip: ERROR


# Local external components (Ed25519 OTA signature verification)
external_components:
  - source:
      type: local
      path: esphome/components
    components: [ota_signature]

# Include all component configuration
packages:
  connectivity: !include components/connectivity.yaml
  provisioning: !include components/provisioning.yaml
  leds: !include components/leds.yaml
  api: !include components/api.yaml
  boot: !include components/boot.yaml
  ota: !include components/ota.yaml
  interface_order: !include components/01_interface_order.yaml
